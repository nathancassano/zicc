# 4096 KiB HiROM: 64 physical 64 KiB banks, mapped at $C0-$FF
# No copier header. Code can use full banks. Near RAM uses data bank $7E
# Reserve first-bank ROM data with ld65 -D __NEAR_ROM_SIZE__=N
# The option keeps its old name. Use far pointers to reach ROM data
# N defaults to zero. Count DATA and LORAM_DATA bytes stored in ROM, RODATA, and padding
# Use an even N up to $7FA0. The linker fills unused reserved bytes with $FF
# CODE and STARTUP share one area and can cross offset $8000
# Point every interrupt vector at a VECTOR_STUBS entry visible in bank zero
# These entries jump to their handlers (JML) or return from an unused interrupt (RTI)
# Assemble runtime/vectors.s with -D HIROM=1 to supply the entry stubs
# Use bank $C0 far addresses for RODATA. The entry stubs use the bank $80 mirror
# Near RAM starts at $7E:0500 with the default stack and ends at $7E:FFFF
# This layout limits reserved first-bank ROM data to the upper 32 KiB
# To place code or data in another bank, select its BANKxx segment
# tools/romtool.c recognizes HiROM raw images marked $31 at $FFD5
# Automatic builds provide that marker and generate their own placement config
# The SNES header starts at file offset $FFC0 and the vectors start at $FFE0
SYMBOLS {
    __zicc_reset_offset__: type=weak, value=0, addrsize=far;
 __RUNTIME_RAM_BOTTOM__: type=export, value=$7F0000;
 __RUNTIME_RAM_TOP__: type=export, value=$800000;
    __console_init: type = weak, value = 0;
    __format_float_hook: type = weak, value = 0;
    __format_int64_hook: type = weak, value = 0;
    __NEAR_ROM_SIZE__: type = weak, value = $0000;
    __vector_nmi: type = weak, value = unused_interrupt;
    __vector_irq: type = weak, value = unused_interrupt;
    __vector_brk: type = weak, value = unused_interrupt;
    __vector_cop: type = weak, value = unused_interrupt;
    __STACK_BOTTOM__: type = export, value = $0100;
    __STACK_SIZE__:   type = weak, value = $0400;
    __STACK_TOP__:    type = export, value = __STACK_BOTTOM__ + __STACK_SIZE__ - 1;
    __ARITH_BASE__:   type = export, value = __SCRATCH_START__;
    __dp_scratch:     type = weak, value = __SCRATCH_START__, addrsize = zp;
}
MEMORY {
 RAM7F_PROBE: start=$7F0000, size=$10000, type=rw, file="";
    DP:       start = $000022, size = $00DE, type = rw, file = "", define = yes;
    SCRATCH:    start = $000002, size = $0020, type = rw, file = "", define = yes;
    NEAR:     start = $7E0100 + __STACK_SIZE__, size = $FF00 - __STACK_SIZE__, type = rw, file = "", define = yes;
    # Validation-only area: enforce the upper-32-KiB ROM-data policy
    ROM_DATA_LIMIT: start = $C08000, size = $7FA0 - __NEAR_ROM_SIZE__,
                    type = ro, file = "";
    ROM_DATA_ALIGN: start = $000000, size = (__NEAR_ROM_SIZE__ / 2) * 2 - __NEAR_ROM_SIZE__,
                    type = ro, file = "";
    ROM:      start = $C00000, size = $FFA0 - __NEAR_ROM_SIZE__,
              type = ro, file = %O, fill = yes, fillval = $FF;
    ROM_DATA: start = $C0FFA0 - __NEAR_ROM_SIZE__, size = __NEAR_ROM_SIZE__,
              type = ro, file = %O, fill = yes, fillval = $FF;
    STUBS:    start = $80FFA0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $FF;
    HEADER:   start = $80FFC0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $00;
    VECTORS:  start = $80FFE0, size = $0020, type = ro, file = %O,
