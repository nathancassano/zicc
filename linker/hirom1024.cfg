# 1024 KiB HiROM: 16 physical 64 KiB banks, mapped at $C0-$CF
# No copier header. Code can use full banks. Near RAM uses data bank $7E
# Reserve first-bank ROM data with ld65 -D __NEAR_ROM_SIZE__=N
# The option keeps its old name. Use far pointers to reach ROM data
# N defaults to zero. Count DATA and LORAM_DATA bytes stored in ROM, RODATA, and padding
# Use an even N up to $7FA0. The linker fills unused reserved bytes with $FF
# CODE and STARTUP share one area and can cross offset $8000
# Point every interrupt vector at a VECTOR_STUBS entry visible in bank zero
# These entries jump to their handlers (JML) or return from an unused interrupt (RTI)
# Assemble runtime/vectors.s with -D HIROM=1 to supply the entry stubs
# Use bank $C0 far addresses for RODATA. The entry stubs use the bank $80 mirror
# Near RAM starts at $7E:0500 with the default stack and ends at $7E:FFFF
# This layout limits reserved first-bank ROM data to the upper 32 KiB
# To place code or data in another bank, select its BANKxx segment
# tools/romtool.c recognizes HiROM raw images marked $31 at $FFD5
# Automatic builds provide that marker and generate their own placement config
# The SNES header starts at file offset $FFC0 and the vectors start at $FFE0
SYMBOLS {
    __zicc_reset_offset__: type=weak, value=0, addrsize=far;
 __RUNTIME_RAM_BOTTOM__: type=export, value=$7F0000;
 __RUNTIME_RAM_TOP__: type=export, value=$800000;
    __console_init: type = weak, value = 0;
    __format_float_hook: type = weak, value = 0;
    __format_int64_hook: type = weak, value = 0;
    __NEAR_ROM_SIZE__: type = weak, value = $0000;
    __vector_nmi: type = weak, value = unused_interrupt;
    __vector_irq: type = weak, value = unused_interrupt;
    __vector_brk: type = weak, value = unused_interrupt;
    __vector_cop: type = weak, value = unused_interrupt;
    __STACK_BOTTOM__: type = export, value = $0100;
    __STACK_SIZE__:   type = weak, value = $0400;
    __STACK_TOP__:    type = export, value = __STACK_BOTTOM__ + __STACK_SIZE__ - 1;
    __ARITH_BASE__:   type = export, value = __SCRATCH_START__;
    __dp_scratch:     type = weak, value = __SCRATCH_START__, addrsize = zp;
}
MEMORY {
 RAM7F_PROBE: start=$7F0000, size=$10000, type=rw, file="";
    DP:       start = $000022, size = $00DE, type = rw, file = "", define = yes;
    SCRATCH:    start = $000002, size = $0020, type = rw, file = "", define = yes;
    NEAR:     start = $7E0100 + __STACK_SIZE__, size = $FF00 - __STACK_SIZE__, type = rw, file = "", define = yes;
    # Validation-only area: enforce the upper-32-KiB ROM-data policy
    ROM_DATA_LIMIT: start = $C08000, size = $7FA0 - __NEAR_ROM_SIZE__,
                    type = ro, file = "";
    ROM_DATA_ALIGN: start = $000000, size = (__NEAR_ROM_SIZE__ / 2) * 2 - __NEAR_ROM_SIZE__,
                    type = ro, file = "";
    ROM:      start = $C00000, size = $FFA0 - __NEAR_ROM_SIZE__,
              type = ro, file = %O, fill = yes, fillval = $FF;
    ROM_DATA: start = $C0FFA0 - __NEAR_ROM_SIZE__, size = __NEAR_ROM_SIZE__,
              type = ro, file = %O, fill = yes, fillval = $FF;
    STUBS:    start = $80FFA0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $FF;
    HEADER:   start = $80FFC0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $00;
    VECTORS:  start = $80FFE0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $00;
    ROMC1:    start = $C10000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC2:    start = $C20000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC3:    start = $C30000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC4:    start = $C40000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC5:    start = $C50000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC6:    start = $C60000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC7:    start = $C70000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC8:    start = $C80000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMC9:    start = $C90000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMCA:    start = $CA0000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMCB:    start = $CB0000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMCC:    start = $CC0000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMCD:    start = $CD0000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMCE:    start = $CE0000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
    ROMCF:    start = $CF0000, size = $10000, type = ro, file = %O,
              fill = yes, fillval = $FF;
}
SEGMENTS {
 CONSOLE_MAP: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
 RUNTIME_BSS: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
 RUNTIME_CLOCK: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
 RUNTIME_CONSOLE: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
    ZEROPAGE:   load = DP,       type = zp,  optional = yes, define = yes, align = $0002;
    DP_SCRATCH: load = SCRATCH,    type = zp,  optional = yes, define = yes;
    LORAM_BSS:  load = NEAR, type = bss, optional = yes, define = yes, align = $0002;
    LORAM_DATA: load = ROM_DATA, run = NEAR, type = rw, optional = yes, define = yes, align = $0002;
    BSS:        load = NEAR,     type = bss, optional = yes, define = yes, align = $0002;
    DATA:       load = ROM_DATA, run = NEAR, type = rw, optional = yes,
                define = yes, align = $0002;
    RODATA:     load = ROM_DATA, type = ro, optional = yes, align = $0002;
    EMBED:      load = ROM_DATA, type = ro, optional = yes, align = $0002;
    STARTUP:    load = ROM,      type = ro;
    CODE:       load = ROM,      type = ro;
    NMI_USER:   load = ROM,     type = ro, optional = yes;
    NMI_BANK: load = ROM, type = ro, optional = yes;
    NMI_LIBRARY: load = ROM,    type = ro, optional = yes;
    NMI_END:    load = ROM,     type = ro, optional = yes;
    VECTOR_STUBS: load = STUBS,  type = ro;
    HEADER:     load = HEADER,   type = ro;
    VECTORS:    load = VECTORS,  type = ro;
    BANKC1:     load = ROMC1,    type = ro, optional = yes;
    BANKC2:     load = ROMC2,    type = ro, optional = yes;
    BANKC3:     load = ROMC3,    type = ro, optional = yes;
    BANKC4:     load = ROMC4,    type = ro, optional = yes;
    BANKC5:     load = ROMC5,    type = ro, optional = yes;
    BANKC6:     load = ROMC6,    type = ro, optional = yes;
    BANKC7:     load = ROMC7,    type = ro, optional = yes;
    BANKC8:     load = ROMC8,    type = ro, optional = yes;
    BANKC9:     load = ROMC9,    type = ro, optional = yes;
    BANKCA:     load = ROMCA,    type = ro, optional = yes;
    BANKCB:     load = ROMCB,    type = ro, optional = yes;
    BANKCC:     load = ROMCC,    type = ro, optional = yes;
    BANKCD:     load = ROMCD,    type = ro, optional = yes;
    BANKCE:     load = ROMCE,    type = ro, optional = yes;
    BANKCF:     load = ROMCF,    type = ro, optional = yes;
}
