# 4096 KiB LoROM: 128 physical 32 KiB banks, mapped at $80-$FF
# No copier header. The SNES header and interrupt vectors use the last 64 bytes of bank $80
# Ordinary code and ROM constants must fit in bank $80
# Near RAM uses bank $7E (from $0500 with the default stack). Use far addresses for ROM constants
# Select extra banks with ca65 segments BANK81 through BANKFF
# Use bank-aware assembly to read or call across banks. Near calls keep their usual rules
# tools/romtool.c finalizes power-of-two LoROM images through 4 MiB
# Automatic HiROM builds use generated layouts from tools/build-rom.py
MEMORY {
 RAM7F_PROBE: start=$7F0000, size=$10000, type=rw, file="";
    DP:       start = $000022, size = $00DE, type = rw, file = "", define = yes;
    SCRATCH:    start = $000002, size = $0020, type = rw, file = "", define = yes;
    NEAR:     start = $7E0100 + __STACK_SIZE__, size = $FF00 - __STACK_SIZE__, type = rw, file = "", define = yes;
    ROM:      start = $808000, size = $7FC0, type = ro, file = %O,
              fill = yes, fillval = $FF;
    HEADER:   start = $80FFC0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $00;
    VECTORS:  start = $80FFE0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $00;
    ROM81:    start = $818000, size = $8000, type = ro, file = %O,
