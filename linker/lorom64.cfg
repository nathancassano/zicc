# 64 KiB LoROM: 2 physical 32 KiB banks, mapped at $80-$81
# No copier header. The SNES header and interrupt vectors use the last 64 bytes of bank $80
# Ordinary code and ROM constants must fit in bank $80
# Near RAM uses bank $7E (from $0500 with the default stack). Use far addresses for ROM constants
# Select the extra bank with the ca65 segment BANK81
# Use bank-aware assembly to read or call across banks. Near calls keep their usual rules
# tools/romtool.c finalizes power-of-two LoROM images through 4 MiB
# Automatic HiROM builds use generated layouts from tools/build-rom.py
MEMORY {
 RAM7F_PROBE: start=$7F0000, size=$10000, type=rw, file="";
    DP:       start = $000022, size = $00DE, type = rw, file = "", define = yes;
    SCRATCH:    start = $000002, size = $0020, type = rw, file = "", define = yes;
    NEAR:     start = $7E0100 + __STACK_SIZE__, size = $FF00 - __STACK_SIZE__, type = rw, file = "", define = yes;
    ROM:      start = $808000, size = $7FC0, type = ro, file = %O,
              fill = yes, fillval = $FF;
    HEADER:   start = $80FFC0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $00;
    VECTORS:  start = $80FFE0, size = $0020, type = ro, file = %O,
              fill = yes, fillval = $00;
    ROM81:    start = $818000, size = $8000, type = ro, file = %O,
              fill = yes, fillval = $FF;
}
SEGMENTS {
 CONSOLE_MAP: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
 RUNTIME_BSS: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
 RUNTIME_CLOCK: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
 RUNTIME_CONSOLE: load=RAM7F_PROBE, type=bss, optional=yes, define=yes, align=2;
    ZEROPAGE:   load = DP,      type = zp,  optional = yes, define = yes, align = $0002;
    DP_SCRATCH: load = SCRATCH,   type = zp,  optional = yes, define = yes;
    LORAM_BSS:  load = NEAR, type = bss, optional = yes, define = yes, align = $0002;
    LORAM_DATA: load = ROM, run = NEAR, type = rw, optional = yes, define = yes, align = $0002;
    BSS:        load = NEAR,    type = bss, optional = yes, define = yes, align = $0002;
    DATA:       load = ROM, run = NEAR, type = rw, optional = yes,
                define = yes, align = $0002;
    STARTUP:    load = ROM,     type = ro;
    CODE:       load = ROM,     type = ro;
    NMI_USER:   load = ROM,     type = ro, optional = yes;
    NMI_BANK: load = ROM, type = ro, optional = yes;
    NMI_LIBRARY: load = ROM,    type = ro, optional = yes;
    NMI_END:    load = ROM,     type = ro, optional = yes;
    RODATA:     load = ROM,     type = ro, optional = yes, align = $0002;
    EMBED:      load = ROM,     type = ro, optional = yes, align = $0002;
    HEADER:     load = HEADER,  type = ro;
    VECTORS:    load = VECTORS, type = ro;
    BANK81:     load = ROM81,   type = ro, optional = yes;
}
SYMBOLS {
    __zicc_reset_offset__: type=weak, value=0, addrsize=far;
 __RUNTIME_RAM_BOTTOM__: type=export, value=$7F0000;
 __RUNTIME_RAM_TOP__: type=export, value=$800000;
    __console_init: type = weak, value = 0;
    __format_float_hook: type = weak, value = 0;
    __format_int64_hook: type = weak, value = 0;
    __vector_nmi: type = weak, value = unused_interrupt;
    __vector_irq: type = weak, value = unused_interrupt;
    __vector_brk: type = weak, value = unused_interrupt;
    __vector_cop: type = weak, value = unused_interrupt;
    __STACK_BOTTOM__: type = export, value = $0100;
    __STACK_SIZE__:   type = weak, value = $0400;
    __STACK_TOP__:    type = export, value = __STACK_BOTTOM__ + __STACK_SIZE__ - 1;
    __ARITH_BASE__:   type = export, value = __SCRATCH_START__;
    __dp_scratch:     type = weak, value = __SCRATCH_START__, addrsize = zp;
}
